[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ipaper"
version = "1.0.3"
description = "Home Assistant Interactive e-Paper Dashboard (For Kobo, Kindle, etc...)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["home-assistant", "epaper", "dashboard"]

dependencies = [
  "PyYAML",
  "homeassistant-api>=6.1.0",
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "dynaconf>=3.2.12",
  "python-multipart>=0.0.21",
  "tzdata>=2025.3",
  "matplotlib>=3.10.8",
]

[project.urls]
Home = "https://github.com/o0zz/ha-ipaper"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ha_ipaper*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "websockets>=15.0.1",
]

[project.scripts]
ha-ipaper = "ha_ipaper.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
